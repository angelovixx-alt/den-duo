name: Build EdenDuo + Nextendo Unified APK (Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-edenduo-nextendo
  cancel-in-progress: true

jobs:
  build-edenduo-nextendo:
    name: Merge Den2 (Nextendo) into Eden Duo 1.3.4 & Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install CMake 3.31.6 + NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build ccache python3 python3-pip glslang-tools zip unzip jq

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release \
            -storepass android123 -keypass android123 \
            -dname "CN=EdenDuoNextendo, OU=Dev, O=EdenDuo, L=City, S=State, C=US"
          echo "ANDROID_KEYSTORE_FILE=/tmp/release.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_B64=$(base64 -w 0 /tmp/release.jks)" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASS=android123" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=release" >> $GITHUB_ENV

      - name: Clone Eden Duo & Den2 with Submodules
        run: |
          git clone --recursive https://github.com/igawa6/eden-duo.git workspace-edenduo
          git clone --recursive https://github.com/Dmr77680/Den2.git workspace-den2

      - name: Merge Nextendo Stack into Eden Duo & Strip Debug Packet Logging
        run: |
          python3 - << 'PYEOF'
          import os, re, shutil, pathlib

          duo = pathlib.Path("workspace-edenduo")
          den = pathlib.Path("workspace-den2")

          for rel in ["src/core/hle/service/sockets/bsd.cpp", "src/core/hle/service/ssl/ssl.cpp"]:
              p = den / rel
              if p.exists():
                  txt = p.read_text(encoding="utf-8", errors="ignore")
                  txt = re.sub(r'LOG_INFO\([^;]*\[Nextendo\][^;]*\);', '(void)0;', txt)
                  p.write_text(txt, encoding="utf-8")

          standalone_files = [
              "src/common/nextendo_account.cpp",
              "src/common/nextendo_account.h",
              "src/common/nextendo_friends.h",
              "src/common/nextendo_nat.h",
              "src/web_service/nextendo_api.cpp",
              "src/web_service/nextendo_api.h",
              "src/core/hle/service/ssl/nextendo_nat_rewrite.cpp",
              "src/core/hle/service/ssl/nextendo_nat_rewrite.h",
              "src/core/loader/nextendo_s3_patches.cpp",
              "src/core/loader/nextendo_s3_patches.h",
          ]
          for rel in standalone_files:
              src = den / rel
              dst = duo / rel
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f"[+] Copied standalone module: {rel}")

          hle_network_files = [
              "src/core/hle/service/acc/acc.cpp",
              "src/core/hle/service/acc/acc.h",
              "src/core/hle/service/acc/profile_manager.cpp",
              "src/core/hle/service/acc/profile_manager.h",
              "src/core/hle/service/friend/friend.cpp",
              "src/core/hle/service/friend/friend.h",
              "src/core/hle/service/npns/npns.cpp",
              "src/core/hle/service/sockets/bsd.cpp",
              "src/core/hle/service/sockets/bsd.h",
              "src/core/hle/service/sockets/nsd.cpp",
              "src/core/hle/service/sockets/sfdnsres.cpp",
              "src/core/hle/service/ssl/cert_store.cpp",
              "src/core/hle/service/ssl/ssl.cpp",
              "src/core/hle/service/ssl/ssl_backend_openssl.cpp",
          ]
          for rel in hle_network_files:
              src = den / rel
              dst = duo / rel
              if src.exists():
                  shutil.copy2(src, dst)
                  print(f"[+] Updated HLE/Network service: {rel}")

          def add_cmake_source(cmake_path, anchor, new_entries):
              if not cmake_path.exists():
                  return
              txt = cmake_path.read_text(encoding="utf-8")
              to_add = [e for e in new_entries if e not in txt]
              if to_add and anchor in txt:
                  replacement = anchor + "\n    " + "\n    ".join(to_add)
                  cmake_path.write_text(txt.replace(anchor, replacement, 1), encoding="utf-8")
                  print(f"[+] Registered {to_add} in {cmake_path}")

          add_cmake_source(duo / "src/common/CMakeLists.txt", "uuid.h", ["nextendo_account.cpp", "nextendo_account.h", "nextendo_friends.h", "nextendo_nat.h"])
          add_cmake_source(duo / "src/web_service/CMakeLists.txt", "web_backend.h", ["nextendo_api.cpp", "nextendo_api.h"])
          add_cmake_source(duo / "src/core/CMakeLists.txt", "hle/service/ssl/ssl.h", ["hle/service/ssl/nextendo_nat_rewrite.cpp", "hle/service/ssl/nextendo_nat_rewrite.h"])
          add_cmake_source(duo / "src/core/CMakeLists.txt", "loader/nso.h", ["loader/nextendo_s3_patches.cpp", "loader/nextendo_s3_patches.h"])

          core_cpp = duo / "src/core/core.cpp"
          if core_cpp.exists():
              txt = core_cpp.read_text(encoding="utf-8")
              if "nextendo_account.h" not in txt:
                  txt = '#include "common/nextendo_account.h"\n' + txt
              if "WriteGuestBridge" not in txt:
                  txt = txt.replace(
                      "status = app_loader->Load(*process, system);",
                      "Common::NextendoAccount::LoadFromDisk();\n        Common::NextendoAccount::WriteGuestBridge(Common::FS::GetEdenPath(Common::FS::EdenPath::SDMCDir));\n        status = app_loader->Load(*process, system);"
                  )
              core_cpp.write_text(txt, encoding="utf-8")
              print("[+] Patched src/core/core.cpp with NextendoAccount::LoadFromDisk & WriteGuestBridge")

          nso_cpp = duo / "src/core/loader/nso.cpp"
          if nso_cpp.exists():
              txt = nso_cpp.read_text(encoding="utf-8")
              if "nextendo_s3_patches.h" not in txt:
                  txt = '#include "core/loader/nextendo_s3_patches.h"\n' + txt
              if "NextendoS3Patches::ApplyIfMatch" not in txt and "pm->PatchNSO(new_image, name)" in txt:
                  txt = txt.replace(
                      "new_image = pm->PatchNSO(new_image, name);",
                      "new_image = pm->PatchNSO(new_image, name);\n        new_image = NextendoS3Patches::ApplyIfMatch(nso_header.build_id, std::move(new_image), name);"
                  )
              nso_cpp.write_text(txt, encoding="utf-8")
              print("[+] Patched src/core/loader/nso.cpp with NextendoS3Patches")

          print("[*] Surgical C++ merge complete.")
          PYEOF

      - name: Compile Unified EdenDuo + Nextendo Release APK (-O3 Release)
        id: build_unified
        continue-on-error: true
        working-directory: workspace-edenduo
        run: |
          mkdir -p ../output-apks
          sh .ci/android/build.sh -t standard -b Release
          find artifacts src/android/app/build/outputs/apk -name "*.apk" -exec cp -v {} ../output-apks/EdenDuo-Nextendo-Release.apk \; || true

      - name: Compile Den2 in Full -O3 Release Mode (Optimized Nextendo Build)
        continue-on-error: true
        working-directory: workspace-den2
        run: |
          mkdir -p ../output-apks
          sh .ci/android/build.sh -t standard -b Release || sh .ci/android/build.sh -t standard -b RelWithDebInfo
          for f in artifacts/*.apk src/android/app/build/outputs/apk/**/*.apk; do
            if [ -f "$f" ]; then
              cp -v "$f" ../output-apks/DEN-Turbo-Release.apk
            fi
          done

      - name: Upload Compiled Release APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EdenDuo-Nextendo-Release-APK
          path: output-apks/*.apk
          if-no-files-found: warn
