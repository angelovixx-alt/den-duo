name: Build EdenDuo + Nextendo Unified APK (Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-edenduo-nextendo
  cancel-in-progress: true

jobs:
  build-edenduo-nextendo:
    name: Merge Den2 (Nextendo) into Eden Duo 1.3.4 & Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Free Disk Space & Install Android SDK / NDK 28.2.13676358
        shell: bash
        run: |
          set +e
          set +o pipefail
          sudo rm -rf "$ANDROID_HOME/ndk/"25* "$ANDROID_HOME/ndk/"26* "$ANDROID_HOME/ndk/"27* "$ANDROID_HOME/.temp"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null && break
            rm -rf "$ANDROID_HOME/.temp"
          done
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          exit 0

      - name: Install Native Build Tools & Keystore
        run: |
          sudo apt-get update && sudo apt-get install -y git cmake ninja-build ccache python3 glslang-tools zip unzip jq
          keytool -genkeypair -v -keystore /tmp/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass android123 -keypass android123 -dname "CN=EdenDuoNextendo, OU=Dev, O=EdenDuo, L=City, S=State, C=US"
          echo "ANDROID_KEYSTORE_FILE=/tmp/release.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_B64=$(base64 -w 0 /tmp/release.jks)" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASS=android123" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=release" >> $GITHUB_ENV

      - name: Clone Eden Duo & Den2 with Submodules
        run: |
          git clone --recursive https://github.com/igawa6/eden-duo.git workspace-edenduo
          git clone --recursive https://github.com/Dmr77680/Den2.git workspace-den2

      - name: Merge Nextendo Stack into Eden Duo & Strip Debug Packet Logging
        run: |
          cp -rf workspace-den2/src/core/hle/service/{acc,friend,npns,sockets,ssl} workspace-edenduo/src/core/hle/service/
          cp -f workspace-den2/src/common/{settings.h,settings.cpp,nextendo_*} workspace-edenduo/src/common/
          cp -f workspace-den2/src/web_service/nextendo_* workspace-edenduo/src/web_service/
          cp -f workspace-den2/src/core/loader/nextendo_* workspace-edenduo/src/core/loader/
          cp -rf workspace-den2/src/network/* workspace-edenduo/src/network/
                  python3 - << 'PYEOF'
          import re, pathlib
          for base in [pathlib.Path("workspace-edenduo"), pathlib.Path("workspace-den2")]:
              for rel in ["src/core/hle/service/sockets/bsd.cpp", "src/core/hle/service/ssl/ssl.cpp"]:
                  p = base / rel
                  if p.exists():
                      p.write_text(re.sub(r\bLOG_INFO\b', 'LOG_TRACE', p.read_text()), encoding="utf-8")
          duo = pathlib.Path("workspace-edenduo")
          def reg(f, a, items):
              p = duo / f
              t = p.read_text()
              if items[0] not in t:
                  p.write_text(t.replace(a, a + "\n    " + "\n    ".join(items), 1))
          reg("src/common/CMakeLists.txt", "uuid.h", ["nextendo_account.cpp", "nextendo_account.h", "nextendo_friends.h", "nextendo_nat.h"])
          reg("src/web_service/CMakeLists.txt", "web_backend.h", ["nextendo_api.cpp", "nextendo_api.h"])
          reg("src/core/CMakeLists.txt", "hle/service/ssl/ssl.h", ["hle/service/ssl/nextendo_nat_rewrite.cpp", "hle/service/ssl/nextendo_nat_rewrite.h"])
          reg("src/core/CMakeLists.txt", "loader/nso.h", ["loader/nextendo_s3_patches.cpp", "loader/nextendo_s3_patches.h"])
          c = duo / "src/core/core.cpp"
          c.write_text('#include "common/nextendo_account.h"\n' + c.read_text().replace("status = app_loader->Load(*process, system);", "Common::NextendoAccount::WriteGuestBridge(Common::FS::GetEdenPath(Common::FS::EdenPath::SDMCDir));\n        status = app_loader->Load(*process, system);"))
          n = duo / "src/core/loader/nso.cpp"
          n.write_text('#include "core/loader/nextendo_s3_patches.h"\n' + n.read_text().replace("new_image = pm->PatchNSO(new_image, name);", "new_image = pm->PatchNSO(new_image, name);\n        new_image = NextendoS3Patches::ApplyIfMatch(nso_header.build_id, std::move(new_image), name);"))
          PYEOF

      - name: Compile Unified EdenDuo + Nextendo Release APK (-O3 Release)
        id: build_unified
        continue-on-error: true
        working-directory: workspace-edenduo
        run: |
            mkdir -p ../output-apks artifacts
            sh .ci/android/build.sh -t standard -b Release || true
            find artifacts src/android/app/build/outputs/apk -name "*.apk" -exec cp -v {} ../output-apks/EdenDuo-Nextendo-Release.apk \; || true
            test -f ../output-apks/EdenDuo-Nextendo-Release.apk
      - name: Fallback Compile Den2 in Full -O3 Release Mode
        if: steps.build_unified.outcome == 'failure'
        working-directory: workspace-den2
        run: |
            mkdir -p ../output-apks artifacts
            sh .ci/android/build.sh -t standard -b Release || sh .ci/android/build.sh -t standard -b RelWithDebInfo || true
            find artifacts src/android/app/build/outputs/apk -name "*.apk" -exec cp -v {} ../output-apks/DEN-Turbo-Release.apk \; || true

      - name: Upload Compiled Release APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EdenDuo-Nextendo-Release-APK
          path: output-apks/*.apk
          if-no-files-found: warn
